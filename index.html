<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Callejero Bombers València</title>
  <meta name="description" content="Simulador de preguntas: parque y parque que coopera para cada calle de València.">
  <meta name="theme-color" content="#b3261e">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%23b3261e%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Callejero Bombers València</h1>
    <button id="btn-home" class="link" hidden>Inicio</button>
  </header>

  <main>
    <!-- Pantalla de inicio -->
    <section id="view-home" class="view">
      <p class="lead">Te pregunto calles al azar. Para cada una marca el <strong>parque</strong> que le corresponde y el parque que <strong>coopera</strong>. Si fallas, te corrijo con el dato oficial.</p>

      <div class="card">
        <label class="field">
          <span>Preguntas por tanda</span>
          <select id="opt-size">
            <option value="10" selected>10</option>
            <option value="20">20</option>
            <option value="50">50</option>
          </select>
        </label>
        <fieldset class="field">
          <legend>Qué calles</legend>
          <label class="radio"><input type="radio" name="mode" value="nuevas" checked> Aleatorias (primero las que aún no te he preguntado)</label>
          <label class="radio"><input type="radio" name="mode" value="fallos"> Solo las que has fallado <span id="fail-count" class="muted"></span></label>
        </fieldset>
        <fieldset class="field">
          <legend>Parque principal</legend>
          <div id="opt-zones" class="chips"></div>
        </fieldset>
        <button id="btn-start" class="primary big">Empezar</button>
      </div>

      <div id="progress" class="card small"></div>
      <p class="muted small" id="sources"></p>
    </section>

    <!-- Pregunta -->
    <section id="view-quiz" class="view" hidden>
      <div class="qhead">
        <span id="q-counter" class="muted"></span>
        <span id="q-score" class="muted"></span>
      </div>
      <div class="street card">
        <div id="q-street" class="street-name"></div>
        <div id="q-number" class="street-number" hidden></div>
        <div id="q-alt" class="muted small"></div>
      </div>

      <div class="group">
        <div class="group-label">Parque</div>
        <div id="ans-parque" class="options"></div>
      </div>
      <div class="group">
        <div class="group-label">Coopera</div>
        <div id="ans-coopera" class="options"></div>
      </div>

      <button id="btn-check" class="primary big" disabled>Comprobar</button>

      <div id="feedback" class="card feedback" hidden>
        <div id="fb-title" class="fb-title"></div>
        <div id="fb-detail"></div>
        <div id="fb-tramos"></div>
        <div id="map" class="map"></div>
        <button id="btn-next" class="primary big">Siguiente</button>
      </div>
    </section>

    <!-- Resultado -->
    <section id="view-result" class="view" hidden>
      <div class="card center">
        <div id="r-score" class="score"></div>
        <div id="r-detail" class="muted"></div>
      </div>
      <div class="actions">
        <button id="btn-retry" class="primary big">Repetir las falladas</button>
        <button id="btn-again" class="secondary big">Nueva tanda</button>
      </div>
      <ol id="r-list" class="result-list"></ol>
    </section>
  </main>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>

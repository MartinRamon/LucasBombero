<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Callejero Bombers València</title>
  <meta name="description" content="Simulador de preguntas: parque y parque que coopera para cada calle de València.">
  <meta name="theme-color" content="#b3261e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Callejero">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button id="btn-home" class="icon-btn" aria-label="Salir al inicio" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
    </button>
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="28" height="28">
      <span>Callejero Bombers</span>
    </div>
    <div id="top-right" class="top-right"></div>
  </header>

  <main>
    <!-- Inicio -->
    <section id="view-home" class="view">
      <div class="hero">
        <p class="eyebrow">Oposición Bombers València</p>
        <h1>¿Qué parque sale a esta calle?</h1>
        <p class="hero-sub">Te pregunto calles al azar. Tú marcas el <b>parque</b> y el que <b>coopera</b>.</p>
      </div>

      <div class="stats" id="stats"></div>

      <div class="cta">
        <button id="btn-start" class="btn btn-primary btn-xl"></button>
        <button id="btn-fails" class="btn btn-tonal btn-lg" hidden></button>
      </div>

      <details class="card options" id="options">
        <summary>
          <span>Opciones</span>
          <span id="options-summary" class="muted"></span>
        </summary>
        <div class="opt-block">
          <div class="opt-label">Calles por tanda</div>
          <div class="segmented" id="opt-size" role="radiogroup" aria-label="Calles por tanda">
            <button type="button" role="radio" data-value="10">10</button>
            <button type="button" role="radio" data-value="20">20</button>
            <button type="button" role="radio" data-value="50">50</button>
          </div>
        </div>
        <div class="opt-block">
          <div class="opt-label">Parques que entran</div>
          <div id="opt-parks" class="park-toggles"></div>
          <p class="hint">Útil para estudiar las calles de un parque cada vez.</p>
        </div>
        <div class="opt-block">
          <button id="btn-reset" type="button" class="btn btn-text danger">Borrar mi progreso</button>
        </div>
      </details>

      <p class="sources" id="sources"></p>
    </section>

    <!-- Pregunta -->
    <section id="view-quiz" class="view" hidden>
      <div class="quiz-progress" id="q-progress" aria-hidden="true"></div>

      <article class="street-card" id="street-card">
        <div class="street-meta">
          <span id="q-counter"></span>
          <span id="q-streak" class="streak" hidden></span>
        </div>
        <div id="q-type" class="street-type"></div>
        <h2 id="q-street" class="street-name"></h2>
        <div id="q-number" class="street-number" hidden></div>
        <div id="q-alt" class="street-alt"></div>
      </article>

      <div class="step" id="step-parque">
        <div class="step-label"><span class="step-n">1</span> Parque</div>
        <div id="ans-parque" class="park-grid"></div>
      </div>
      <div class="step" id="step-coopera">
        <div class="step-label"><span class="step-n">2</span> Coopera</div>
        <div id="ans-coopera" class="park-grid"></div>
      </div>

      <div id="feedback" class="feedback" hidden aria-live="polite">
        <div class="fb-head">
          <div id="fb-icon" class="fb-icon"></div>
          <div>
            <div id="fb-title" class="fb-title"></div>
            <div id="fb-answer" class="fb-answer"></div>
          </div>
        </div>
        <div id="fb-tramos"></div>
        <div id="map" class="map"></div>
        <div id="map-legend" class="map-legend"></div>
      </div>
      <div class="bottom-spacer"></div>
    </section>

    <!-- Resultado -->
    <section id="view-result" class="view" hidden>
      <div class="result-hero">
        <div id="r-ring" class="ring"></div>
        <div id="r-title" class="r-title"></div>
        <div id="r-detail" class="muted"></div>
      </div>
      <div class="cta">
        <button id="btn-retry" class="btn btn-primary btn-lg">Repetir las falladas</button>
        <button id="btn-again" class="btn btn-tonal btn-lg">Nueva tanda</button>
        <button id="btn-home2" class="btn btn-text">Volver al inicio</button>
      </div>
      <h3 class="list-title">Repaso de la tanda</h3>
      <ul id="r-list" class="result-list"></ul>
    </section>
  </main>

  <!-- Barra inferior fija durante la corrección -->
  <div class="bottom-bar" id="bottom-bar" hidden>
    <button id="btn-next" class="btn btn-primary btn-xl">Siguiente</button>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
